  <rect x="672" y="24" width="196" height="104" rx="12" fill="#F0FDFA" stroke="#99D9D0" stroke-width="1.3" />
  <text x="770" y="67" fill="#0F172A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">v3 逐条清理</text>
  <text x="770" y="101" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">排除语义与构造错误</text>
