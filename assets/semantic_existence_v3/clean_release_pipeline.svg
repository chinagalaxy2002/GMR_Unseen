<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="154" viewBox="0 0 1100 154" role="img" aria-labelledby="title desc">
  <title id="title">从 v1 到未补充版 v3 的数据管线</title>
  <desc id="desc">Charades 正例：真实描述与时间段 → v1 生成候选：改一个动作或对象 → v2 扩展五组：动作与动作×对象留出 → v3 逐条清理：排除语义与构造错误 → 划分后评估：Seen 训练 · Unseen 测试</desc>
  <rect width="1100" height="154" rx="12" fill="#FFFFFF" />
  <rect x="12" y="24" width="196" height="104" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.3" />
  <text x="110" y="67" fill="#0F172A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Charades 正例</text>
  <text x="110" y="101" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">真实描述与时间段</text>
  <path d="M 213 76 H 226 M 220 70 L 226 76 L 220 82" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="232" y="24" width="196" height="104" rx="12" fill="#F0FDFA" stroke="#99D9D0" stroke-width="1.3" />
  <text x="330" y="67" fill="#0F172A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">v1 生成候选</text>
  <text x="330" y="101" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">改一个动作或对象</text>
  <path d="M 433 76 H 446 M 440 70 L 446 76 L 440 82" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="452" y="24" width="196" height="104" rx="12" fill="#F0FDFA" stroke="#99D9D0" stroke-width="1.3" />
  <text x="550" y="67" fill="#0F172A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">v2 扩展五组</text>
  <text x="550" y="101" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">动作与动作×对象留出</text>
