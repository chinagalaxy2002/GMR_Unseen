<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">Balanced v3：保留原样本，按组补齐跨视频负例</title>
<desc id="desc">每个 group / split 独立操作；查询文本与原 S/U 身份继承自 donor 正例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526572"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
<text x="30" y="43" font-size="28" fill="#243746" font-weight="bold" text-anchor="start">Balanced v3：保留原样本，按组补齐跨视频负例</text>
<text x="30" y="77" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">每个 group / split 独立操作；查询文本与原 S/U 身份继承自 donor 正例。</text>
<rect x="30" y="116" width="340" height="180" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="152" font-size="23" fill="#243746" font-weight="bold" text-anchor="start">01  保留 Clean v3</text>
<line x1="50" y1="168" x2="350" y2="168" stroke="#C7D1D8" stroke-width="2"/>
<text x="50" y="203" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">原 qid、查询、视频与窗口</text>
<text x="50" y="237" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">标签与 S/U 身份全部保留</text>
<text x="50" y="271" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">统计需要补充的负例数量</text>
<rect x="430" y="116" width="340" height="180" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="450" y="152" font-size="23" fill="#B95000" font-weight="bold" text-anchor="start">02  原句 + 候选目标视频</text>
<line x1="450" y1="168" x2="750" y2="168" stroke="#C7D1D8" stroke-width="2"/>
<text x="450" y="203" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">“person open a box.”</text>
<text x="450" y="237" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">Donor：FNBYE，身份 U+</text>
<text x="450" y="271" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">候选来自同 group / split</text>
<rect x="830" y="116" width="340" height="180" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="850" y="152" font-size="23" fill="#00846A" font-weight="bold" text-anchor="start">03  CLIP 文本最大相似度</text>
<line x1="850" y1="168" x2="1150" y2="168" stroke="#C7D1D8" stroke-width="2"/>
<text x="850" y="203" font-size="20" fill="#243746" font-weight="normal" text-anchor="start">查询 vs 视频的全部正描述</text>
<text x="850" y="237" font-size="20" fill="#243746" font-weight="normal" text-anchor="start">每个目标视频取最高余弦值</text>
<text x="850" y="271" font-size="20" fill="#243746" font-weight="normal" text-anchor="start">s(q,v) = max cos(q, caption)</text>
<line x1="378" y1="206" x2="418" y2="206" stroke="#526572" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="778" y1="206" x2="818" y2="206" stroke="#526572" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="346" width="665" height="202" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="382" font-size="23" fill="#00846A" font-weight="bold" text-anchor="start">04  按视频分数排名，先取最低一半</text>
<line x1="50" y1="398" x2="675" y2="398" stroke="#C7D1D8" stroke-width="2"/>
<rect x="52" y="445" width="50" height="47" rx="6" fill="#DEF1EB" stroke="#00846A" stroke-width="1.5"/>
<text x="77" y="477" font-size="22" fill="#00846A" font-weight="normal" text-anchor="middle">1</text>
<rect x="113" y="445" width="50" height="47" rx="6" fill="#DEF1EB" stroke="#00846A" stroke-width="1.5"/>
<text x="138" y="477" font-size="22" fill="#00846A" font-weight="normal" text-anchor="middle">2</text>
<rect x="174" y="445" width="50" height="47" rx="6" fill="#DEF1EB" stroke="#00846A" stroke-width="1.5"/>
<text x="199" y="477" font-size="22" fill="#00846A" font-weight="normal" text-anchor="middle">3</text>
<rect x="235" y="445" width="50" height="47" rx="6" fill="#DEF1EB" stroke="#00846A" stroke-width="1.5"/>
<text x="260" y="477" font-size="22" fill="#00846A" font-weight="normal" text-anchor="middle">4</text>
<rect x="296" y="445" width="50" height="47" rx="6" fill="#DEF1EB" stroke="#00846A" stroke-width="1.5"/>
<text x="321" y="477" font-size="22" fill="#00846A" font-weight="normal" text-anchor="middle">5</text>
<rect x="357" y="445" width="50" height="47" rx="6" fill="#EFF1F3" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="382" y="477" font-size="22" fill="#526572" font-weight="normal" text-anchor="middle">6</text>
<rect x="418" y="445" width="50" height="47" rx="6" fill="#EFF1F3" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="443" y="477" font-size="22" fill="#526572" font-weight="normal" text-anchor="middle">7</text>
<rect x="479" y="445" width="50" height="47" rx="6" fill="#EFF1F3" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="504" y="477" font-size="22" fill="#526572" font-weight="normal" text-anchor="middle">8</text>
<rect x="540" y="445" width="50" height="47" rx="6" fill="#EFF1F3" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="565" y="477" font-size="22" fill="#526572" font-weight="normal" text-anchor="middle">9</text>
<rect x="601" y="445" width="50" height="47" rx="6" fill="#EFF1F3" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="626" y="477" font-size="22" fill="#526572" font-weight="normal" text-anchor="middle">10</text>
<text x="50" y="425" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">排名示意（10 个候选）</text>
<text x="50" y="532" font-size="20" fill="#00846A" font-weight="normal" text-anchor="start">低相似 ←  排序  → 高相似；保留前 floor(N/2) 个视频</text>
<rect x="755" y="346" width="415" height="202" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="775" y="382" font-size="23" fill="#00846A" font-weight="bold" text-anchor="start">05  过滤后采样，追加负例</text>
<line x1="775" y1="398" x2="1150" y2="398" stroke="#C7D1D8" stroke-width="2"/>
<text x="775" y="433" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">去重 / 相同描述 / 语义冲突检查</text>
<text x="775" y="467" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">seed 3407 → FNBYE 换为 TCI7K</text>
<text x="775" y="501" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">“person open a box.” → U−，[]</text>
<line x1="1000" y1="298" x2="1000" y2="324" stroke="#526572" stroke-width="2"/>
<line x1="1000" y1="324" x2="360" y2="324" stroke="#526572" stroke-width="2"/>
<line x1="360" y1="324" x2="360" y2="342" stroke="#526572" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="703" y1="449" x2="743" y2="449" stroke="#526572" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="590" width="1140" height="140" rx="6" fill="#EDF6FC" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="626" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">结果示例：C2 Test（完整 split 正负平衡）</text>
<line x1="50" y1="642" x2="1150" y2="642" stroke="#C7D1D8" stroke-width="2"/>
<text x="50" y="676" font-size="26" fill="#0072B2" font-weight="bold" text-anchor="start">原 3,453 正 + 1,158 负   +   新增 2,295 负   →   3,453 正 + 3,453 负</text>
<text x="50" y="713" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">Train 只增加 S−；Val / Test 的新增 S−、U− 配额按原 S+、U+ 比例分配。</text>
</g></svg>
