<text x="995" y="381" font-size="21" fill="#B95000" font-weight="normal" text-anchor="start">U−  []</text>
<text x="644" y="430" font-size="22" fill="#00846A" font-weight="normal" text-anchor="start">CLIP 文本排名 → 低相似候选 → 采样</text>
<text x="644" y="468" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">复用真实查询，重新构造视频–查询配对</text>
