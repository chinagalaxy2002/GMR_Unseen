<rect x="179" y="225" width="8" height="7" rx="0" fill="#243746" stroke="#243746" stroke-width="1.5"/>
<text x="125" y="224" font-size="21" fill="#243746" font-weight="bold" text-anchor="middle">MFGLZ</text>
<text x="219" y="223" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">同一目标视频</text>
<text x="54" y="280" font-size="26" fill="#0072B2" font-weight="normal" text-anchor="start">person opens bag.</text>
<text x="54" y="316" font-size="21" fill="#0072B2" font-weight="normal" text-anchor="start">S+   [[18.7, 30.4]] 秒</text>
<line x1="313" y1="270" x2="313" y2="366" stroke="#526572" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335" y="348" font-size="24" fill="#B95000" font-weight="bold" text-anchor="start">bag → box</text>
<text x="54" y="412" font-size="26" fill="#B95000" font-weight="normal" text-anchor="start">person opens box.</text>
<text x="54" y="453" font-size="21" fill="#B95000" font-weight="normal" text-anchor="start">U−   []   语义审计后保留</text>
<text x="644" y="216" font-size="26" fill="#B95000" font-weight="normal" text-anchor="start">person open a box.</text>
<text x="644" y="252" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">查询文本与 Unseen 身份保持不变</text>
