<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">两种负样本构造：改变查询，或改变配对视频</title>
<desc id="desc">C2 冻结 Test 实例：open × box 为 Unseen；彩色字段标出变化发生在哪里。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526572"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
<text x="30" y="43" font-size="28" fill="#243746" font-weight="bold" text-anchor="start">两种负样本构造：改变查询，或改变配对视频</text>
<text x="30" y="77" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">C2 冻结 Test 实例：open × box 为 Unseen；彩色字段标出变化发生在哪里。</text>
<rect x="30" y="112" width="550" height="390" rx="6" fill="#EDF6FC" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="148" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">(a) Clean v3 · 固定视频，最小语义改写</text>
<line x1="50" y1="164" x2="560" y2="164" stroke="#C7D1D8" stroke-width="2"/>
<rect x="620" y="112" width="550" height="390" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
