<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
<text x="30" y="43" font-size="28" fill="#243746" font-weight="bold" text-anchor="start">六个语义划分的真实例子：Seen / Unseen 与两种负例</text>
<text x="30" y="77" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">均来自冻结 Test 标注；英文保留原句，时间单位为秒。蓝色 Seen，橙色 Unseen。</text>
<rect x="30" y="116" width="550" height="406" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="152" font-size="23" fill="#B95000" font-weight="bold" text-anchor="start">A1_v3  |  动作：物理放置 / 拿取</text>
<line x1="50" y1="168" x2="560" y2="168" stroke="#C7D1D8" stroke-width="2"/>
<text x="48" y="204" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">S+</text>
<text x="101" y="204" font-size="23" fill="#0072B2" font-weight="normal" text-anchor="start">person opens bag.</text>
<text x="101" y="236" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">MFGLZ  ·  [[18.7, 30.4]] s</text>
<text x="48" y="292" font-size="23" fill="#B95000" font-weight="bold" text-anchor="start">U+</text>
<text x="101" y="292" font-size="23" fill="#B95000" font-weight="normal" text-anchor="start">person takes a cup.</text>
<text x="101" y="324" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">4BIMI  ·  [[18.8, 23.7]] s</text>
<line x1="48" y1="352" x2="560" y2="352" stroke="#C7D1D8" stroke-width="2"/>
<text x="48" y="383" font-size="20" fill="#526572" font-weight="bold" text-anchor="start">Clean U−  ·  视频 3W1GP 不变</text>
<text x="48" y="415" font-size="20" fill="#243746" font-weight="normal" text-anchor="start">person open a bag. →</text>
<text x="48" y="447" font-size="20" fill="#B95000" font-weight="normal" text-anchor="start">person take a bag.  []</text>
<text x="48" y="485" font-size="20" fill="#00846A" font-weight="bold" text-anchor="start">Balanced U−  ·  原 U+ 查询不变：4BIMI → GGN5G</text>
<text x="48" y="512" font-size="18" fill="#526572" font-weight="normal" text-anchor="start">换目标视频；relevant_windows = []</text>
