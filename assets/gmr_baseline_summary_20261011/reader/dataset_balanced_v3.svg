<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Balanced v3｜保留 Clean，跨视频补负例</title>
<desc id="desc">沿用 Clean 的正例和五组 Unseen 语义 · 每个完整划分正负 1:1</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526572"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
<text x="30" y="43" font-size="28" fill="#243746" font-weight="bold" text-anchor="start">Balanced v3｜保留 Clean，跨视频补负例</text>
<text x="30" y="77" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">沿用 Clean 的正例和五组 Unseen 语义 · 每个完整划分正负 1:1</text>
<rect x="30" y="105" width="360" height="91" rx="8" fill="#F4F7FA" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="48" y="135" font-size="20" fill="#526572" font-weight="normal" text-anchor="start">Unseen 语义划分</text>
<text x="48" y="177" font-size="31" fill="#243746" font-weight="bold" text-anchor="start">5 组</text>
<rect x="420" y="105" width="360" height="91" rx="8" fill="#EDF6FC" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="438" y="135" font-size="20" fill="#526572" font-weight="normal" text-anchor="start">每组 Test 正例 · 事件存在</text>
<text x="438" y="177" font-size="31" fill="#0072B2" font-weight="bold" text-anchor="start">3,453</text>
<rect x="810" y="105" width="360" height="91" rx="8" fill="#FFF3E8" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="828" y="135" font-size="20" fill="#526572" font-weight="normal" text-anchor="start">每组 Test 负例 · 标注缺席</text>
<text x="828" y="177" font-size="31" fill="#B95000" font-weight="bold" text-anchor="start">3,453</text>
<rect x="30" y="220" width="550" height="109" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="256" font-size="23" fill="#243746" font-weight="bold" text-anchor="start">样本来源</text>
<line x1="50" y1="272" x2="560" y2="272" stroke="#C7D1D8" stroke-width="2"/>
<text x="48" y="292" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">Clean 的原始正负样本与语义身份全部保留。</text>
<text x="48" y="319" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">每组 Test 再增加 2,295 个跨视频伪负例。</text>
<rect x="30" y="345" width="550" height="200" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="381" font-size="23" fill="#B95000" font-weight="bold" text-anchor="start">负例设计</text>
<line x1="50" y1="397" x2="560" y2="397" stroke="#C7D1D8" stroke-width="2"/>
<rect x="48" y="411" width="514" height="38" rx="6" fill="#FFF3E8" stroke="#FFF3E8" stroke-width="1.5"/>
<text x="305" y="437" font-size="22" fill="#B95000" font-weight="bold" text-anchor="middle">真实查询不变   →   配给另一视频</text>
<text x="48" y="479" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">同组、同 train/val/test 内，用 CLIP 排名。</text>
<text x="48" y="506" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">每视频取描述最高相似度，从最低一半采样。</text>
<text x="48" y="533" font-size="21" fill="#243746" font-weight="normal" text-anchor="start">排除原视频、同句、重复和语义冲突，再补齐。</text>
<rect x="620" y="220" width="550" height="325" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="640" y="256" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">哪些查询属于 Unseen？</text>
<line x1="640" y1="272" x2="1150" y2="272" stroke="#C7D1D8" stroke-width="2"/>
<text x="642" y="308" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">A1</text>
<text x="714" y="308" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">物理放置 / 拿取</text>
<line x1="642" y1="322" x2="1148" y2="322" stroke="#DCE4EA" stroke-width="2"/>
<text x="642" y="351" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">A2</text>
<text x="714" y="351" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">饮用 / 倾倒</text>
<line x1="642" y1="365" x2="1148" y2="365" stroke="#DCE4EA" stroke-width="2"/>
<text x="642" y="394" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">A3</text>
<text x="714" y="394" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">跑步 / 行走</text>
<line x1="642" y1="408" x2="1148" y2="408" stroke="#DCE4EA" stroke-width="2"/>
<text x="642" y="437" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">C1</text>
<text x="714" y="437" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">坐 × 床 / 椅子 / 沙发</text>
<line x1="642" y1="451" x2="1148" y2="451" stroke="#DCE4EA" stroke-width="2"/>
<text x="642" y="480" font-size="23" fill="#0072B2" font-weight="bold" text-anchor="start">C2</text>
<text x="714" y="480" font-size="22" fill="#243746" font-weight="normal" text-anchor="start">打开或关闭 × 箱子 / 柜子</text>
<text x="640" y="525" font-size="19" fill="#526572" font-weight="normal" text-anchor="start">新增负例继承查询的 S/U 身份；Train 只补 S−</text>
<rect x="30" y="565" width="1140" height="275" rx="6" fill="white" stroke="#C7D1D8" stroke-width="1.5"/>
<text x="50" y="601" font-size="23" fill="#243746" font-weight="bold" text-anchor="start">实际使用的样本数 · 单位：视频–查询配对</text>
